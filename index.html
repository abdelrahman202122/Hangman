<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hangman</title>
    <link rel="stylesheet" href="./styles/general.css" />
    <link rel="stylesheet" href="./styles/start.css" />
  </head>
  <body>
    <div class="game-container">
      <main>
        <div class="start-page">
          <div class="hero">
            <img src="./assets/general_logo_blue.png" alt="logo" id="logo" />
            <img
              src="./assets/main_menu_play.png"
              alt="play button"
              id="play-btn"
            />
          </div>
          <div class="high-score">
            <img src="./assets/main_menu_cup.png" alt="high score cup" />
            <span class="high-score__number">0</span>
          </div>
        </div>
      </main>

      <footer>
        <div class="copyrights">
          <img src="./assets/hangman.avif" alt="hangman logo" />
          <div>
            <h3>Hangman</h3>
            <p>by MarketJS</p>
          </div>
        </div>
      </footer>
    </div>
    <script src="./js/main.js"></script>
  </body>
</html>
